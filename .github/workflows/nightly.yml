name: Nightly

# Fires automatically after CI passes on main. Builds the exact tested SHA,
# publishes a dated prerelease, then prunes old nightlies. Does NOT push to NuGet.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/_build.yml
    with:
      push-nuget: false
      ref: ${{ github.event.workflow_run.head_sha || github.ref }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute nightly tag
        run: echo "TAG=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: app-artifacts
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: dist
        continue-on-error: true
      - name: Generate release notes (commit-prefix changelog)
        run: node .github/workflows/scripts/update-changelog.mjs --nightly --notes CHANGES.md
      - name: Publish nightly prerelease (same-day tag is reused)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: true
          files: dist/*
          body_path: CHANGES.md

  prune:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GFS prune of old nightlies (7 daily + 4 weekly + 3 monthly)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/scripts/prune-nightlies.mjs
